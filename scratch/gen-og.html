<!DOCTYPE html>
<html><head><title>OG Image Generator</title></head>
<body>
<canvas id="c" width="1200" height="630"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

// Background gradient
const bg = ctx.createLinearGradient(0, 0, 1200, 630);
bg.addColorStop(0, '#0b0d13');
bg.addColorStop(0.5, '#161a27');
bg.addColorStop(1, '#0b0d13');
ctx.fillStyle = bg;
ctx.fillRect(0, 0, 1200, 630);

// Accent line bottom
const accent = ctx.createLinearGradient(0, 0, 1200, 0);
accent.addColorStop(0, '#6c5ce7');
accent.addColorStop(1, '#00cec9');
ctx.fillStyle = accent;
ctx.fillRect(0, 580, 1200, 4);
ctx.globalAlpha = 0.3;
ctx.fillRect(0, 46, 1200, 4);
ctx.globalAlpha = 1;

// Decorative circles
ctx.beginPath();
ctx.arc(1050, 150, 200, 0, Math.PI * 2);
ctx.fillStyle = 'rgba(108,92,231,0.06)';
ctx.fill();

ctx.beginPath();
ctx.arc(150, 480, 150, 0, Math.PI * 2);
ctx.fillStyle = 'rgba(0,206,201,0.05)';
ctx.fill();

// Icon
ctx.font = '80px serif';
ctx.fillText('⛩️', 100, 260);

// Title
ctx.font = '800 72px Inter, system-ui, sans-serif';
ctx.fillStyle = '#e4e6ed';
ctx.fillText('AnimeHub', 100, 350);

// Subtitle
ctx.font = '500 28px Inter, system-ui, sans-serif';
ctx.fillStyle = '#8a8fa8';
ctx.fillText('Watch, Discover & Track Anime Online', 100, 410);

// Badge
ctx.fillStyle = 'rgba(108,92,231,0.9)';
ctx.beginPath();
ctx.roundRect(100, 445, 200, 36, 18);
ctx.fill();
ctx.font = '700 16px Inter, system-ui, sans-serif';
ctx.fillStyle = '#fff';
ctx.fillText('by exotic-exe', 135, 470);

// Features
ctx.font = '20px Inter, system-ui, sans-serif';
ctx.fillStyle = '#5c6180';
ctx.fillText('🔥 Trending  ·  ⭐ Popular  ·  🏆 Top Rated  ·  🔍 Search  ·  📺 Watch', 100, 540);

// Download
canvas.toBlob(blob => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'og-image.png';
  a.click();
  document.title = 'DONE';
}, 'image/png');
</script>
</body></html>
