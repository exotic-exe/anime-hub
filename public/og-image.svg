<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#030712"/>
      <stop offset="50%" style="stop-color:#0a101f"/>
      <stop offset="100%" style="stop-color:#030712"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0284c7"/>
      <stop offset="100%" style="stop-color:#38bdf8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="620" width="1200" height="10" fill="url(#blueGlow)"/>
  <rect x="0" y="0" width="1200" height="4" fill="url(#blueGlow)" opacity="0.6"/>
  
  <!-- Decorative Glows -->
  <circle cx="1000" cy="180" r="220" fill="#0284c7" opacity="0.12"/>
  <circle cx="200" cy="500" r="180" fill="#38bdf8" opacity="0.08"/>
  
  <!-- Icon Badge -->
  <rect x="100" y="170" width="76" height="76" rx="18" fill="url(#blueGlow)"/>
  <text x="138" y="226" font-family="Inter, system-ui, sans-serif" font-size="52" font-weight="900" fill="#ffffff" text-anchor="middle">E</text>
  
  <!-- Title -->
  <text x="100" y="340" font-family="Inter, system-ui, sans-serif" font-size="76" font-weight="900" fill="#ffffff">Exotic<tspan fill="#38bdf8">Hub</tspan></text>
  
  <!-- Subtitle -->
  <text x="100" y="410" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="600" fill="#94a3b8">Watch, Track &amp; Discover Anime Online</text>
  
