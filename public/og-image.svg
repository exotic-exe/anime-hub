<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000000"/>
      <stop offset="50%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#000000"/>
    </linearGradient>
    <linearGradient id="lineGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#27272a"/>
      <stop offset="50%" style="stop-color:#52525b"/>
      <stop offset="100%" style="stop-color:#27272a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="624" width="1200" height="6" fill="url(#lineGlow)"/>
  <rect x="0" y="0" width="1200" height="2" fill="url(#lineGlow)" opacity="0.6"/>
  
  <!-- Subtle Monochromatic Glows -->
  <circle cx="1000" cy="180" r="240" fill="#ffffff" opacity="0.03"/>
  <circle cx="200" cy="500" r="200" fill="#ffffff" opacity="0.02"/>
  
  <!-- Title -->
  <text x="100" y="300" font-family="Inter, system-ui, sans-serif" font-size="82" font-weight="900" fill="#ffffff" letter-spacing="-1">Exotic<tspan fill="#a1a1aa">Hub</tspan></text>
  
  <!-- Subtitle -->
  <text x="100" y="375" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="600" fill="#a1a1aa">Watch, Track &amp; Discover Anime Online</text>
  
  <!-- Badge -->
  <rect x="100" y="420" width="200" height="42" rx="21" fill="#ffffff"/>
  <text x="140" y="447" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="900" fill="#000000">STREAM ANIME</text>
  
  <!-- Features -->
  <text x="100" y="540" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="500" fill="#71717a">Trending  ·  Most Popular  ·  Top Rated  ·  Custom Subtitles (CC)</text>
</svg>
