  <text x="135" y="482" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="800" fill="#ffffff">STREAM ANIME</text>
  
  <!-- Features -->
  <text x="100" y="550" font-family="Inter, system-ui, sans-serif" font-size="20" fill="#64748b">Trending  ·  Most Popular  ·  Top Rated  ·  Custom Subtitles (CC)</text>
